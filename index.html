.vsec{background:#0f0f1e;padding:22px;}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const SERIES = "Colossians: Christ at the Centre";
const REFRAIN = "Have you met Him? Are you living in Him?";

const sessions = [
  {
    week: 0, label: "Intro", title: "Christ at the Centre", passage: "Introduction", videoId: "PlHgZX1IUvc", verses: null,
    questionSets: [
      { label: "Set 1", context: "After the opening", questions: ["Have you ever felt more or less accepted by God based on how well you were doing spiritually? What drove that feeling?", "Why do you think the idea of 'access to God' is such a powerful human concern? Why hasn't it gone away?", "Why do we so easily slip back to asking 'What must I do to enter God's presence?' rather than 'If I am already in Christ, how do I now live?'"] },
      { label: "Set 2", context: "After the main talk", questions: ["Can you think of areas of life where you're more likely to live towards God — doing things to get closer — rather than from God, living differently because you are already in Christ?", "If the church really believed it already lives in God's presence, what might change about how we relate to one another?", "What would it look like this week to live from the reality that you are already in Christ, rather than trying to earn closeness to God?"] },
    ],
  },
  {
    week: 1, label: "Week 1", title: "The Gospel Changes Everything", passage: "Colossians 1:3\u20138", videoId: "Dn11w7PTW0U",

      { n: 3, t: "We always thank God, the Father of our Lord Jesus Christ, when we pray for you," },

    questionSets: [
      { label: "Set 1", context: "After the introduction", questions: ["When you hear the word 'Christian,' what do you think people around you most assume it means?", "Which feels more true of you right now: 'I'm trying to be better' or 'I'm learning to be with Jesus'? Why?", "What do you think is the biggest difference between moral improvement and actually knowing Christ?"] },
      { label: "Set 2", context: "After 'Faith in Christ'", questions: ["What does faith look like in real life this week?", "Where in your life right now do you most need faith to be a gift of God rather than bravado? What would that look like?", "What's one situation where you're tempted to rely on yourself rather than lean on Christ?"] },
      { label: "Set 3", context: "After 'Hope produces faith and love'", questions: ["What do you think you normally build your hope on day to day?", "How would your relationships change if your hope was truly secure — held safe beyond the reach of this life?", "Paul says hope fuels faith and love. Where do you see that connection in your own life?"] },

  {
    week: 2, label: "Week 2", title: "Life Inside the Temple", passage: "Colossians 1:9\u201314", videoId: "PyDUQ37ipMc",

      { n: 9, t: "And so, from the day we heard, we have not ceased to pray for you, asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding," },

      { label: "Set 3", context: "After 'Life inside the temple'", questions: ["What might be some 'boxes' you're still living out of — areas of life not yet settled into life with Christ?", "What helps you trust that God is patient and present as you unpack?", "What would it look like this week to open just one box with Him?"] },
    ],
  },
  {
    week: 3, label: "Week 3", title: "The Only Stage That Matters", passage: "Colossians 1:15\u201323", videoId: "-b7M0sFrZP4",
    verses: [
      { n: 15, t: "He is the image of the invisible God, the firstborn of all creation." },
      { n: 16, t: "For by him all things were created, in heaven and on earth, visible and invisible, whether thrones or dominions or rulers or authorities — all things were created through him and for him." },
      { n: 17, t: "And he is before all things, and in him all things hold together." },
      { n: 18, t: "And he is the head of the body, the church. He is the beginning, the firstborn from the dead, that in everything he might be preeminent." },
      { n: 19, t: "For in him all the fullness of God was pleased to dwell," },
      { n: 20, t: "and through him to reconcile to himself all things, whether on earth or in heaven, making peace by the blood of his cross." },
      { n: 21, t: "And you, who once were alienated and hostile in mind, doing evil deeds," },
      { n: 22, t: "he has now reconciled in his body of flesh by his death, in order to present you holy and blameless and above reproach before him," },
      { n: 23, t: "if indeed you continue in the faith, stable and steadfast, not shifting from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, and of which I, Paul, became a minister." },
    ],
    questionSets: [
      { label: "Set 1", context: "After 'Stage building'", questions: ["Where do you notice pressure to present a version of yourself rather than your real self?", "What do you think people are really searching for underneath the need for a stage?", "Why do you think humanity has always tried to make a name for itself?"] },
      { label: "Set 2", context: "After 'The centre already exists'", questions: ["Which description of Jesus in this passage stands out most to you, and why?", "What changes about how you live if everything really is for Him?", "How does knowing Christ is the true temple reshape how we think about getting closer to God?"] },
      { label: "Set 3", context: "After 'The name you don't have to build'", questions: ["What do you find hardest to believe about being presented holy and blameless before God?", "Where are you still tempted to build a name for yourself rather than receive one?", "What helps you stay rooted in Christ instead of drifting toward comparison?"] },

  {

      { label: "Set 1", context: "After the introduction", questions: ["Do you recognise the difference between reluctant duty and joyful love in your own walk with Christ? What does that tension look like for you?", "If 'Christ in you' is true through the week, what difference could it make in how you handle stress, how you speak to family, or how you respond to disappointment?", "Paul labours hard, but with Christ's energy. Where are you currently overworking in your own strength — or avoiding effort altogether?"] },
      { label: "Set 2", context: "After 'Knit together in love'", questions: ["When do you find it hardest to love your brothers and sisters? What does being knitted together in love mean in those moments?", "Paul links encouragement with assurance. Who has encouraged your faith in the past year? Who might God be prompting you to intentionally encourage this week?", "If Christ truly dwells in other believers, how does that change the way we listen to them, the way we disagree, and the way we forgive?"] },
      { label: "Set 3", context: "After 'So that no one may delude you'", questions: ["How does 'Jesus plus' pressure appear in your life and thinking — Jesus plus success, impressive parenting, spiritual experiences, theological mastery, image management?", "When do you most drift from knowing Christ as your centre — when tired, busy, criticised, praised, scrolling, comparing?", "If someone watched your last seven days, what would they conclude is at the centre of your life?"] },
    ],
  },
  {
    week: 5, label: "Week 5", title: "No Ladder Required", passage: "Colossians 2:6\u201315", videoId: "cBMjEX5MWvo",
    verses: [
      { n: 6, t: "Therefore, as you received Christ Jesus the Lord, so walk in him," },

      { label: "Set 1", context: "After the opening — Jacob and Nathaniel", questions: ["Jacob grabbed even at the moment of divine encounter. Nathaniel received. Which instinct do you recognise more in yourself right now — grabbing or receiving?", "Jesus told Nathaniel he was the true meeting place of heaven and earth, the One who came down rather than a ladder to climb up. What does it do to you to hear that the presence you might have been straining toward has actually come to you?", "Where are you with the two questions we have been carrying through this series? Have you met Him — and are you living in Him?"] },
      { label: "Set 2", context: "After the ache and the fullness", questions: ["Every human being carries a God-shaped ache. Where do you feel the world — or even religious culture — offering created things to fill what only the Creator can satisfy?", "Paul says 'you have been filled in him' — something already done and settled. What part of you resists that? What would need to change if you actually believed it?", "If thanksgiving is the overflow of someone who has genuinely received the gift — not more stuff, but the Creator himself at Christ's expense — what would it look like for that to become the dominant tone of your life this week?"] },
      { label: "Set 3", context: "After circumcision, the charge sheet, and the cross", questions: ["The charge sheet — the record of everything we owe God that we cannot pay — has been wiped clean and nailed to the cross. Where are we still living as though we need to appease powers that have already been defeated?", "Being rooted in Christ means our identity is secured at a depth that emotional ups and downs and moral failure cannot reach. Is there an area of your life where you are still trying to secure your own identity rather than receiving it from where you are planted?", "One scholar, having worked through every verse of this passage, closes with a single sentence: what really matters then is Christ and Christ alone. Is that actually true of what drives your week? What would need to change if it were?"] },
    ],

function App() {
  const [wi, setWi] = useState(sessions.length - 1);
  const [si, setSi] = useState(null);
  const [qi, setQi] = useState(null);
  const [rdrOpen, setRdrOpen] = useState(false);
  const s = sessions[wi];

  const pickWeek = (i) => { setWi(i); setSi(null); setQi(null); setRdrOpen(false); };
  const pickSet = (i) => { if (si === i) { setSi(null); setQi(null); } else { setSi(i); setQi(null); } };
  const pickQ = (i) => setQi(qi === i ? null : i);

  return (
    <div className="app">
      <header className="hdr">
        <span className="hdr-s">{SERIES}</span>
        <span className="hdr-r">{REFRAIN}</span>

      <nav className="wnav">
        {sessions.map((x, i) => (

      </nav>

      <div className="hero">
        <div className="wklbl">{s.week === 0 ? "Series Introduction" : `Week ${s.week}`}</div>

            <div className="vmeta">

              <div className="vtitle">{s.title}</div>
            </div>

        <div className="inst">

        </div>
        <div className="stabs">
          {s.questionSets.map((set, i) => (
            <button key={i} className={`stab${si === i ? " on" : ""}`} onClick={() => pickSet(i)}>{set.label}</button>
          ))}
        </div>
        {si !== null && (
          <div className="spanel">
            <div className="sctx">{s.questionSets[si].context}</div>
            <div className="qlist">
              {s.questionSets[si].questions.map((q, i) => (
                <div key={i} className={`qcard${qi === i ? " on" : ""}`} onClick={() => pickQ(i)}>
                  {qi === i && <div className="qdot"></div>}
                  <div className="qnum">Question {i + 1}</div>
                  <div className="qtxt">{q}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <footer className="ftr">
        <div className="fr">{REFRAIN}</div>
        <div className="fs">{SERIES}</div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
