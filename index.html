function PreWatch({ passage, verses }) {
  const [open, setOpen] = useState(false);
  if (!verses) return null;
  return (
    <div className="pre-watch">
      <div className="pre-card">
        <button className="pre-tog" onClick={() => setOpen(!open)}>
          <div className="pre-tog-left">
            <span className="pre-step">Before you start the video</span>
            <span className="pre-tog-title">Read {passage} together</span>
          </div>
          <span className={`pre-arrow${open ? " open" : ""}`}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="3,6 8,11 13,6" /></svg>
          </span>
        </button>
        {open && (
          <div className="pre-body">
            <div className="pre-esv">ESV · English Standard Version</div>
            <div className="pre-verses">
              {verses.map((v, i) => (
                <div className="pre-verse" key={i}>
                  <span className="pre-vnum">{v.n}</span>
                  <span className="pre-vtxt">{v.t}</span>
                </div>
              ))}
            </div>
            <div className="pre-credit">Scripture from the ESV® Bible © 2001 Crossway. Used by permission.</div>
          </div>
        )}
      </div>
    </div>
  );
}

function VideoCard({ session }) {
  if (!session.videoId) {
    return (
      <div className="vsec">
        <div className="vcard" style={{cursor:'default'}}>
          <div className="vbg">{session.title}</div>
          <div className="vcont">
            <div className="vmeta">
              <div className="vtag">Week {session.week} · {session.passage}</div>
              <div className="vtitle">{session.title}</div>
            </div>
            <div className="vlbl" style={{opacity:.5}}>Video coming soon</div>
          </div>
        </div>
      </div>
    );
  }
  return (
    <div className="vsec">
      <a className="vcard" href={`https://youtu.be/${session.videoId}`} target="_blank" rel="noopener noreferrer">
        <div className="vbg">{session.title}</div>
        <div className="vcont">
          <div className="vmeta">
            <div className="vtag">{session.week === 0 ? "Introduction" : `Week ${session.week}`} · {session.passage}</div>
            <div className="vtitle">{session.title}</div>
          </div>
          <div className="pbtn"><div className="pico"></div></div>
          <div className="vlbl">Watch on YouTube</div>
        </div>
      </a>
    </div>
  );
}

function SectionCard({ section, index }) {
  const [open, setOpen] = useState(false);
  const [qi, setQi] = useState(null);
  const hasVerses = section.verses && section.verses.length > 0;
  const hasQuestions = section.questions && section.questions.length > 0;
  const hasContent = hasVerses || hasQuestions;

  // Sections with no content render as non-expandable outline markers
  if (!hasContent) {
    return (
      <div className="sec-marker">
        <span className="sec-marker-num">{index + 1}</span>
        <span className="sec-marker-heading">{section.heading}</span>
      </div>
    );
  }

  return (
    <div className={`sec-card${open ? " open" : ""}`}>
      <button className="sec-head" onClick={() => { setOpen(!open); setQi(null); }}>
        <span className="sec-num">{index + 1}</span>
        <div className="sec-info">
          <span className="sec-heading">{section.heading}</span>
          <div className="sec-tags">
            {hasVerses && <span className="sec-tag">Passage</span>}
            {hasQuestions && <span className="sec-tag">Discussion</span>}
          </div>
        </div>
        <span className="sec-arrow">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="3,6 8,11 13,6" /></svg>
        </span>
      </button>
      {open && (
        <div className="sec-body">
          {hasVerses && (
            <div className="sec-passage">
              <div className="sec-esv-label">ESV · English Standard Version</div>
              <div className="verses">
                {section.verses.map((v, i) => (
                  <div className="verse" key={i}>
                    <span className="vnum">{v.n}</span>
                    <span className="vtxt">{v.t}</span>
                  </div>
                ))}
              </div>
              <div className="esv-credit">Scripture from the ESV® Bible © 2001 Crossway. Used by permission.</div>
            </div>
          )}
          {hasVerses && hasQuestions && <hr className="sec-div" />}
          {hasQuestions && (
            <div className="sec-questions">
              <div className="sec-q-label">Discussion Questions</div>
              <div className="qlist">
                {section.questions.map((q, i) => (
                  <div key={i} className={`qcard${qi === i ? " on" : ""}`} onClick={() => setQi(qi === i ? null : i)}>
                    {qi === i && <div className="qdot"></div>}
                    <div className="qnum">Question {i + 1}</div>
                    <div className="qtxt">{q}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [wi, setWi] = useState(sessions.length - 1);
  const s = sessions[wi];
  return (
    <div className="app">
      <header className="hdr">
        <span className="hdr-s">{SERIES}</span>
        <span className="hdr-r">{REFRAIN}</span>
      </header>
      <nav className="wnav">
        {sessions.map((x, i) => (
          <button key={i} className={`wtab${wi === i ? " on" : ""}`} onClick={() => setWi(i)}>{x.label}</button>
        ))}
      </nav>
      <div className="hero" key={wi}>
        <div className="wklbl">{s.week === 0 ? "Series Introduction" : `Week ${s.week}`}</div>
        <h1 className="htitle">{s.title}</h1>
        <div className="hpass">{s.passage}</div>
      </div>
      <PreWatch key={`pre-${wi}`} passage={s.passage} verses={s.fullPassage} />
      <VideoCard session={s} />
      <div className="sections" key={`s${wi}`}>
        <div className="sec-inst">Work through the sections below as you watch. Expandable cards contain the passage and discussion questions for that section. Italic sections are teaching — no discussion break.</div>
        {s.sections.map((sec, i) => (
          <SectionCard key={`${wi}-${i}`} section={sec} index={i} />
        ))}
      </div>
      <footer className="ftr">
        <div className="fr">{REFRAIN}</div>
        <div className="fs">{SERIES}</div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
